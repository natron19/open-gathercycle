# GRADE Goal: turn an organization's growth goal into a three-phase cycle plan
# (awareness, engagement, consolidation) with 3-4 concrete tasks per phase. "Good" =
# exactly 3 phases, every task has an owner_type (leader, volunteer, or staff), an effort
# estimate, and a measurable success indicator. Top concerns: the tasks plausibly reach the
# stated goal, and the workload is spread realistically across a small, volunteer-run team.
template: gathercycle_plan_v1

rubric:
  - dimension: useful
    criterion: Taken together, the tasks plausibly reach the stated growth goal within the time period, and each success indicator is measurable.
  - dimension: useful
    criterion: The workload is distributed sensibly. Tasks are spread across leader, volunteer, and staff owners to match each role's definition, and no single owner type carries an unrealistic load for a small organization.
  - dimension: accurate
    criterion: The plan is specific to the organization and audience described, with no invented facts such as budgets, partners, or member counts the input does not mention.

cases:
  - id: golden_professional_association
    kind: golden
    segment: association
    variables:
      organization_name: "Bay Area UX Researchers Guild"
      time_period: "Q1 2027 (12 weeks)"
      goal_description: "Grow paying membership from 140 to 200 and get at least 30 members to attend a monthly meetup"
      audience_description: "Early and mid-career UX researchers in the Bay Area, many working remotely"
    checks:
      - { type: json_valid }
      - { type: has_keys, keys: [phases] }
      - { type: count_between, path: phases, min: 3, max: 3 }
      - { type: each_has_keys, path: phases, keys: [phase, tasks] }
      - { type: values_in, path: phases, field: phase, allowed: [awareness, engagement, consolidation] }
      - { type: count_between, path: phases.0.tasks, min: 3, max: 4 }
      - { type: each_has_keys, path: phases.0.tasks, keys: [title, owner_type, effort_estimate, success_indicator] }
      - { type: values_in, path: phases.0.tasks, field: owner_type, allowed: [leader, volunteer, staff] }
      - { type: count_between, path: phases.1.tasks, min: 3, max: 4 }
      - { type: each_has_keys, path: phases.1.tasks, keys: [title, owner_type, effort_estimate, success_indicator] }
      - { type: values_in, path: phases.1.tasks, field: owner_type, allowed: [leader, volunteer, staff] }
      - { type: count_between, path: phases.2.tasks, min: 3, max: 4 }
      - { type: each_has_keys, path: phases.2.tasks, keys: [title, owner_type, effort_estimate, success_indicator] }
      - { type: values_in, path: phases.2.tasks, field: owner_type, allowed: [leader, volunteer, staff] }
      - { type: max_chars, value: 6000, dimension: efficient }

